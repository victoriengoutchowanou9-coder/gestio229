<!doctype html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GESTIO 229 ERP - Version Entreprise V3.0 (Bénin & UEMOA)</title>
  <meta name="theme-color" content="#0B1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GESTIO 229" />
  <meta name="application-name" content="GESTIO 229" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <script>
    // Capture anticipée du prompt d'installation PWA avant l'hydratation React
    window.__gestio_deferred_prompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__gestio_deferred_prompt = e;
      window.dispatchEvent(new CustomEvent('gestio-pwa-installable', { detail: e }));
    });
    window.addEventListener('appinstalled', function() {
      window.__gestio_deferred_prompt = null;
      try { localStorage.setItem('gestio_pwa_installed', 'true'); } catch(e) {}
      window.dispatchEvent(new CustomEvent('gestio-pwa-installed'));
    });
  </script>
</head>
<body class="h-full m-0 p-0">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
